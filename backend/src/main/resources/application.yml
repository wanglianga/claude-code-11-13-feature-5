server:
  port: 8080

spring:
  application:
    name: rtbf-console
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/rtbf}
    username: ${DB_USERNAME:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: compliance
    schemas: compliance,biz
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # 执行前可撤回延迟窗口（分钟），窗口内可撤回、候选人可撤回注销
  cancel-window-minutes: ${CANCEL_WINDOW_MINUTES:30}
  # 监管问询函要求的法定答复期限（工作日）
  legal-deadline-workdays: 15
  # 候选人查询门户限时凭证有效期（分钟）
  portal-token-minutes: ${PORTAL_TOKEN_MINUTES:30}
  evidence:
    dir: ${EVIDENCE_DIR:./evidence}

logging:
  level:
    com.example.rtbf: INFO
